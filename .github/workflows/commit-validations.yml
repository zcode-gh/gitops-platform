name: Commit Validations

on:
  pull_request:
    branches:
      - main

jobs:
  commit_lint:
    name: Run Commit Lint
    uses: zcode-gh/gitops-workflow/.github/workflows/commit-lint.yml@387549597d6e6bb069359024dd88049aa01513e7 # v1.3.0
    with:
      owner: ${{ github.repository_owner }}
      repositories: ${{ github.event.repository.name }}
    secrets:
      github_app_id: ${{ secrets.CREATE_TOKEN_APP_ID }}
      github_app_private_key: ${{ secrets.CREATE_TOKEN_APP_PRIVATE_KEY }}

  pr_diff_check:
    uses: zcode-gh/gitops-workflow/.github/workflows/github-pr-diff-check.yml@387549597d6e6bb069359024dd88049aa01513e7 # v1.3.0
    with:
      comparison_branches: dev
      github_base_ref: ${{ github.base_ref }}
      github_head_ref: ${{ github.head_ref }}
      owner: ${{ github.repository_owner }}
      repositories: ${{ github.event.repository.name }}
    secrets:
      github_app_id: ${{ secrets.CREATE_TOKEN_APP_ID }}
      github_app_private_key: ${{ secrets.CREATE_TOKEN_APP_PRIVATE_KEY }}

  github_post_comment:
    name: Github Post Comment
    if: always()
    needs: pr_diff_check
    uses: zcode-gh/gitops-workflow/.github/workflows/github-post-comment.yml@387549597d6e6bb069359024dd88049aa01513e7 # v1.3.0
    with:
      github_repository: ${{ github.repository }}
      github_event_pull_request_number: ${{ github.event.pull_request.number }}
      encoded_comment_title: ${{ needs.pr_diff_check.outputs.encoded_comment_title }}
      encoded_comment_outputs: ${{ needs.pr_diff_check.outputs.encoded_comment_outputs }}
      owner: ${{ github.repository_owner }}
      repositories: ${{ github.event.repository.name }}
    secrets:
      github_app_id: ${{ secrets.CREATE_TOKEN_APP_ID }}
      github_app_private_key: ${{ secrets.CREATE_TOKEN_APP_PRIVATE_KEY }}
      github_secret_token: ${{ secrets.GITHUB_TOKEN }}
